name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs the full history to attribute code to authors and
          # to work out what counts as "new code"; a shallow clone breaks both.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # `playwright` the package is installed, but `playwright install`
      # (browser binaries, ~400MB) is deliberately skipped: every test runs
      # against an in-file getShowtimes fixture and stubs the browser path.
      #
      # `--only-binary :all:` makes pip refuse source distributions, so no
      # package's setup.py executes on the runner. Verified against the
      # runner's target (cp312/manylinux): the resolved tree is 21
      # distributions and every one of them has a wheel, playwright and
      # greenlet included, so this constrains what pip may do without changing
      # what it installs.
      #
      # `python -m pip install --upgrade pip` used to lead this block. The run
      # log shows it doing nothing -- setup-python already provides the current
      # pip -- and pinning it would turn it into a downgrade the day the runner
      # image moves ahead, so the line is gone instead.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt --only-binary :all:
          # Test-only set, kept out of the runtime manifest. The pins moved
          # from this command line into requirements-ci.txt at the same
          # versions, so behaviour is unchanged -- but Dependabot parses
          # manifests, not shell, and can now see and bump them. See that
          # file's header.
          pip install -r requirements-ci.txt --only-binary :all:

      # monitor.py and lock.py are the two source modules at the repo root;
      # everything else here is shell scripts, logs and tests.
      - name: Run pytest
        run: |
          python -m pytest -q \
            --cov=monitor --cov=lock --cov-report=xml --cov-report=term

      - name: Coverage summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print("## Coverage")
          print()
          print(f"**{rate * 100:.2f}%** of statements in `monitor.py` + `lock.py` covered.")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      # Runs after pytest so coverage.xml already exists. Configuration lives in
      # sonar-project.properties at the repo root.
      #
      # Analysis is advisory, not a gate: continue-on-error keeps a SonarCloud
      # outage or a scanner hiccup from failing the required check.
      - name: SonarCloud analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
