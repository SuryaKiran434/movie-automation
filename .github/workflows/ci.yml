name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # `playwright` the package is installed, but `playwright install`
      # (browser binaries, ~400MB) is deliberately skipped: every test runs
      # against an in-file getShowtimes fixture and stubs the browser path.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only; requirements.txt stays the pinned runtime set.
          pip install pytest pytest-cov

      # monitor.py and lock.py are the two source modules at the repo root;
      # everything else here is shell scripts, logs and tests.
      - name: Run pytest
        run: |
          python -m pytest -q \
            --cov=monitor --cov=lock --cov-report=xml --cov-report=term

      - name: Coverage summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print("## Coverage")
          print()
          print(f"**{rate * 100:.2f}%** of statements in `monitor.py` + `lock.py` covered.")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
