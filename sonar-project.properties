# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off for this project: it cannot import test
# coverage. The scan is run from .github/workflows/ci.yml, after pytest has
# written coverage.xml.

sonar.projectKey=SuryaKiran434_movie-automation
sonar.organization=suryakiran434

# monitor.py and lock.py are the two source modules at the repo root;
# everything else here is shell scripts, logs and tests.
sonar.sources=monitor.py,lock.py
sonar.tests=tests

# pytest is invoked with --cov=monitor --cov=lock --cov-report=xml, which
# writes coverage.xml to the repository root.
sonar.python.coverage.reportPaths=coverage.xml

# Never analysis targets: vendored/installed dependencies and the test suite
# (the latter is declared above as tests, not sources).
sonar.exclusions=**/venv/**,**/.venv/**,**/node_modules/**,tests/**

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
